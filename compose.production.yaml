services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetlinx
      POSTGRES_USER: vetlinx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetlinx -d vetlinx"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - vetlinx_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment: &api_environment
      NODE_ENV: production
      PORT: 4000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://vetlinx:${POSTGRES_PASSWORD}@postgres:5432/vetlinx
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      EVIDENCE_STORAGE_PATH: /app/var/evidence
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      MAIL_TRANSPORT: smtp
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      DELIVERY_ENCRYPTION_KEY: ${DELIVERY_ENCRYPTION_KEY:?Set DELIVERY_ENCRYPTION_KEY}
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/src/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - vetlinx_evidence:/app/var/evidence

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment: *api_environment
    command: ["node", "dist/src/worker.js"]
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        VETLINX_API_URL: http://api:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VETLINX_API_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  vetlinx_postgres_data:
  vetlinx_evidence:
