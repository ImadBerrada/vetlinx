services:
  postgres:
    image: postgres:17-alpine
    container_name: vetlinx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetlinx
      POSTGRES_USER: vetlinx
      POSTGRES_PASSWORD: vetlinx_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetlinx -d vetlinx"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vetlinx_postgres_data:/var/lib/postgresql/data

volumes:
  vetlinx_postgres_data:

